name: Build & Release Extension

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Extension ZIP
        run: |
          zip -r youtube-fiddle-looper.zip manifest.json content.js style.css README.md

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-fiddle-looper
          path: youtube-fiddle-looper.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: youtube-fiddle-looper.zip
          tag_name: latest
          name: "YouTube Fiddle Looper (Latest Release)"
          body: "Ready-to-install browser extension package. For Firefox, download 'youtube-fiddle-looper.zip' and load directly in about:debugging without extracting."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
